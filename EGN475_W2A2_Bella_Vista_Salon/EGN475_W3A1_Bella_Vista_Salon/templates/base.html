<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Bella Vista Salon{% endblock %}</title>

    <!-- Pico CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Shared Navigation -->
    <nav class="container">
        <ul>
            <li>
                <strong>Bella Vista Salon</strong>
            </li>
        </ul>

        <ul>
            <li>
                <a href="{{ url_for('home') }}">Home</a>
            </li>

            <li>
                <a href="{{ url_for('services') }}">Services</a>
            </li>

            <li>
                <a href="{{ url_for('book') }}">Book</a>
            </li>

            <li>
                <a href="{{ url_for('calendar') }}">Calendar</a>
            </li>

            <li>
                <a href="{{ url_for('appointments') }}">Appointments</a>
            </li>
        </ul>
    </nav>

    <!-- Page Content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer class="container">
        <hr>

        <p>
            <small>
                © 2026 Bella Vista Salon. All rights reserved.
            </small>
        </p>
    </footer>

</body>
</html>
